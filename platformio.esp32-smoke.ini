; Isolated target-build configuration. This file does not modify the native-test
; environment in platformio.ini.
[platformio]
default_envs = esp32-adapter-link
src_dir = target/esp32_adapter_link
lib_dir = lib

[env:esp32-adapter-link]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
lib_deps =
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
lib_ldf_mode = chain+
monitor_speed = 115200
build_flags =
  -std=gnu++11
  -Wall
  -Wextra
  -Wl,--wrap=nvs_flash_init
  -Wl,--wrap=esp_partition_erase_range
