; Dedicated hardware-probe firmware. Never use as attendance firmware.
; Separate from native tests and the inert compile/link smoke target.
[platformio]
default_envs = esp32-hardware-probe
src_dir = target/esp32_hardware_probe
lib_dir = lib

[env:esp32-hardware-probe]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
lib_deps =
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
lib_ldf_mode = chain+
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -std=gnu++11
  -Wall
  -Wextra
  -Wl,--wrap=nvs_flash_init
  -Wl,--wrap=esp_partition_erase_range
  -Wl,-Map,.pio/build/esp32-hardware-probe/firmware.map
