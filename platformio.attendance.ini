; Production-oriented ATT boot-shell target. This is not a diagnostic probe.
; Current scope is deliberately read-only until authenticated session/routes,
; production service composition and storage transaction gates are implemented.
[platformio]
default_envs = att-boot-shell
src_dir = target/esp32_attendance
lib_dir = lib

[env:att-boot-shell]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
extra_scripts = pre:tools/apply_pinned_webserver_patch.py
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = target/esp32_attendance/partitions_att.csv
lib_deps =
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
lib_ldf_mode = chain+
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -std=gnu++11
  -Wall
  -Wextra
  -Wl,--wrap=nvs_flash_init
  -Wl,--wrap=esp_partition_erase_range
